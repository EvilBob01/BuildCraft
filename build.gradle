plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.171'
    id 'maven-publish'
}

version = '8.0.1-1.21.1'
group = 'com.mod-buildcraft'
base { archivesName = 'buildcraft' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

minecraft.accessTransformers.file rootProject.file('buildcraft_resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        systemProperty 'buildcraft.dev', 'true'
        modSource project.sourceSets.main
    }

    client {
        client()
        workingDirectory project.file('run')
    }

    server {
        server()
        workingDirectory project.file('run/server')
    }

    data {
        data()
        workingDirectory project.file('run')
        programArguments.addAll '--mod', 'buildcraftlib',
            '--all',
            '--output', file('buildcraft_resources/').absolutePath,
            '--existing', file('buildcraft_resources/').absolutePath
    }
}

sourceSets {
    main {
        java {
            srcDir 'common'
            srcDir 'common_old_license'
            srcDir 'BuildCraftAPI/api'
            srcDir 'sub_projects/expression/src/main/java'
            srcDir 'sub_projects/expression/src/autogen/java'
        }
        resources {
            srcDir 'buildcraft_resources'
            srcDir 'BuildCraft-Localization'
        }
    }
    test {
        java {
            srcDir 'src/test/java'
            srcDir 'sub_projects/expression/src/test/java'
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.172"
    testImplementation 'junit:junit:4.13.2'
}

compileJava {
    options.compilerArgs << '-Xmaxerrs' << '2000'
    options.compilerArgs << '-Xmaxwarns' << '2'
    options.encoding = 'UTF-8'
}

processResources {
    var replaceProperties = [
        minecraft_version : '1.21.1',
        neo_version       : '21.1.172',
        mod_version       : project.version,
        mod_group_id      : project.group
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'BuildCraft',
            'Specification-Vendor'    : 'BuildCraft Team',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'BuildCraft Team',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url layout.buildDirectory.dir('repo')
        }
    }
}
